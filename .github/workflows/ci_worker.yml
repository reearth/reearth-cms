name: ci-worker
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
jobs:
  ci-server-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: go setup
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'worker/go.mod'
          check-latest: true
          cache-dependency-path: 'worker/go.sum'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          working-directory: worker
          args: --config=../.golangci.yml
          skip-cache: true
      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
        working-directory: worker
      - name: Check go fmt
        working-directory: worker
        run: |
          go fmt ./
          git diff --exit-code ./
  ci-server-test:
    name: test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6-focal
        ports:
          - 27017:27017
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: go setup
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'worker/go.mod'
          check-latest: true
          cache-dependency-path: 'worker/go.sum'
      - name: test
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic -timeout 10m ./...
        working-directory: worker
        env:
          REEARTH_CMS_DB: mongodb://localhost
      - name: Send coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          flags: worker
          token: ${{ secrets.CODECOV_TOKEN }}
