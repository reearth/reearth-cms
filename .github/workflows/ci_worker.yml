name: ci-worker
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
jobs:
  ci-server-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: go setup
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'worker/go.mod'
          check-latest: true
          cache-dependency-path: 'worker/go.sum'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: worker
          args: --config=../.golangci.yml
          skip-cache: true
      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
        working-directory: worker
      # The shared module has no CI of its own; the worker CI runs whenever it changes.
      - name: golangci-lint (shared)
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: shared
          args: --config=../.golangci.yml
          skip-cache: true
      - name: Check go.mod tidiness (shared)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
        working-directory: shared
      - name: Check go fmt (shared)
        working-directory: shared
        run: |
          go fmt ./...
          git diff --exit-code ./
      - name: Check go fmt
        working-directory: worker
        run: |
          go fmt ./
          git diff --exit-code ./
  ci-server-test:
    name: test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6-focal
        ports:
          - 27017:27017
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: go setup
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'worker/go.mod'
          check-latest: true
          cache-dependency-path: 'worker/go.sum'
      - name: test
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic -timeout 10m ./...
        working-directory: worker
        env:
          REEARTH_CMS_DB: mongodb://localhost
      - name: test (shared)
        run: go test -v -race ./...
        working-directory: shared
      - name: Send coverage report
        uses: codecov/codecov-action@v7.1.1
        with:
          flags: worker
          token: ${{ secrets.CODECOV_TOKEN }}
