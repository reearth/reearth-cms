name: PR
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: labeler
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork PRs get a read-only token, so labeling would fail with a 403.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
  title_check:
    name: title check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ignoreLabels: meta
          scopes: |
            web
            server
            worker
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
  pr_title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - labeler
      - title_check
    # Skipped is OK (e.g. labeler on fork PRs); failure or cancelled is not.
    # !cancelled() keeps a superseded run (edited/labeled events reuse the same
    # commit) from posting a stale failure for this check.
    if: ${{ !cancelled() }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more PR checks failed or were cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo OK
  assign-author:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same as labeler: needs a writable token, which fork PRs don't get.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a # v3.1.0
