name: Stage
# Step 1 of a release: merge main into the release branch, then build the
# release candidate images (amd64 + arm64) from that exact commit, tagged :rc
# and :stage-<sha>. Release later promotes :stage-<sha>, so the images that
# ship are the ones that were tested as :rc.
on:
  workflow_dispatch:

concurrency:
  group: release-flow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    name: Stage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: git config
        run: |
          git config --global user.name ${{ vars.GH_APP_USER }}
          git config --global user.email ${{ vars.GH_APP_ID }}+${{ vars.GH_APP_USER }}[bot]@users.noreply.github.com
          git config --global pull.rebase false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: sha
        name: Resolve main commit
        run: |
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short origin/main)" >> "$GITHUB_OUTPUT"
      # Only stage a commit that passed CI. Refuse while main's CI is running or failed.
      - name: Check that CI on main finished successfully
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"')
          echo "ci on $SHA: ${run:-none}"
          case "$run" in
            "completed success "*) ;;
            "") echo "::error::No CI run found for main@$SHA"; exit 1 ;;
            *)  echo "::error::CI for main@$SHA is not green yet ($run). Wait for it, then stage again."; exit 1 ;;
          esac
      - name: Checkout release branch
        run: git switch release || git switch -c release
      - name: Merge main branch to release branch
        # --no-ff always records a merge commit; Release reads the staged commit from it.
        run: git merge --no-ff -X theirs -m "Merge branch 'main' into release" "${{ steps.sha.outputs.sha }}"
      - name: Check that release now matches main
        run: |
          if ! git diff --quiet "${{ steps.sha.outputs.sha }}" HEAD -- . ':(exclude)CHANGELOG.md'; then
            echo "::error::After the merge, release still differs from main (files changed only on release). Fix main first."
            git diff --stat "${{ steps.sha.outputs.sha }}" HEAD -- . ':(exclude)CHANGELOG.md'
            exit 1
          fi
      - name: Git push
        run: git push origin release
      - name: Summary
        run: |
          echo "### Staged main@\`${{ steps.sha.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Images: \`:rc\` and \`:stage-${{ steps.sha.outputs.sha }}\` (built by the jobs below)" >> "$GITHUB_STEP_SUMMARY"

  # Build every image from the staged commit (not from :nightly, which can be
  # overwritten by any later merge). :stage-<sha> pins the exact build that
  # Release will promote.
  build-server:
    needs: stage
    uses: ./.github/workflows/build_server.yml
    with:
      name: rc
      ref: ${{ needs.stage.outputs.sha }}
      sha_short: ${{ needs.stage.outputs.sha_short }}
      platforms: linux/amd64,linux/arm64
      extra_tags: stage-${{ needs.stage.outputs.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-web:
    needs: stage
    uses: ./.github/workflows/build_web.yml
    with:
      name: rc
      ref: ${{ needs.stage.outputs.sha }}
      sha_short: ${{ needs.stage.outputs.sha_short }}
      platforms: linux/amd64,linux/arm64
      extra_tags: stage-${{ needs.stage.outputs.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-worker:
    needs: stage
    uses: ./.github/workflows/build_worker.yml
    with:
      name: rc
      ref: ${{ needs.stage.outputs.sha }}
      sha_short: ${{ needs.stage.outputs.sha_short }}
      platforms: linux/amd64,linux/arm64
      extra_tags: stage-${{ needs.stage.outputs.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
