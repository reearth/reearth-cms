name: Web E2E test
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Target branch"
        required: false
        default: "main"
      smoke_only:
        description: "Run smoke tests only"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
      base_url:
        required: true
        type: string
      branch:
        required: true
        type: string
      use_iap:
        description: "Enable IAP authentication"
        required: false
        type: boolean
        default: false
      iap_target_audience:
        description: "IAP OAuth client ID"
        required: false
        type: string
        default: ""
      token_format:
        description: "Token format for authentication"
        required: false
        type: string
        default: "id-token"
      smoke_only:
        description: "Run smoke tests only"
        type: boolean
        required: false
        default: false
    secrets:
      REEARTH_WEB_E2E_USERNAME:
        required: true
      REEARTH_WEB_E2E_PASSWORD:
        required: true
      GC_WORKLOAD_IDENTITY_PROVIDER:
        description: "Workload Identity Federation provider"
        required: false
      GC_SA_EMAIL:
        description: "Service account used to publish Allure reports to GCS"
        required: false
env:
  REEARTH_CMS_API: ${{ inputs.api_url || vars.REEARTH_CMS_API }}
  REEARTH_CMS_E2E_BASEURL: ${{ inputs.base_url || vars.REEARTH_CMS_E2E_BASEURL }}
  REEARTH_CMS_E2E_USERNAME: ${{ secrets.REEARTH_WEB_E2E_USERNAME }}
  REEARTH_CMS_E2E_PASSWORD: ${{ secrets.REEARTH_WEB_E2E_PASSWORD }}
jobs:
  e2e:
    name: playwright
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: e2e-web-allure-reports
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.ALLURE_BUCKET || 'reearth-oss-cms-allure-reports' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: reearth/reearth-cms
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: "**/yarn.lock"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$( node -e "console.log(require('@playwright/test/package.json').version)" )" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: "${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-
      - name: Install Playwright system dependencies and browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium
      - name: Authenticate to Google Cloud
        id: auth
        if: ${{ inputs.use_iap }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GC_WORKLOAD_IDENTITY_PROVIDER }}
          token_format: ${{ inputs.token_format }}
          id_token_audience: ${{ inputs.iap_target_audience }}
          id_token_include_email: true
      - name: Verify IAP Authentication
        if: ${{ inputs.use_iap }}
        run: |
          if [ -z "${{ steps.auth.outputs.id_token }}" ] && [ -z "${{ steps.auth.outputs.access_token }}" ]; then
            echo "Failed to generate authentication token"
            exit 1
          else
            echo "Authentication token generated successfully"
          fi
      - name: Echo info
        run: |
          echo "REEARTH_CMS_API is $REEARTH_CMS_API"
          echo "REEARTH_CMS_E2E_BASEURL is $REEARTH_CMS_E2E_BASEURL"
          echo "REEARTH_CMS_E2E_USERNAME is $REEARTH_CMS_E2E_USERNAME"
          echo "::group::Playwright setup"
          echo "smoke: ${{ inputs.smoke_only && 'true' || 'false' }}"
          echo "workers: 1"
          echo "retries: 4"
          echo "maxFailures: 4"
          echo "fullyParallel: false"
          echo "slowMo: 300ms"
          echo "shards: none"
          echo "::endgroup::"
      - name: Run Playwright tests
        timeout-minutes: 120
        env:
          USE_IAP_AUTH: ${{ inputs.use_iap || false }}
          IAP_AUTH_METHOD: ${{ inputs.token_format || 'id-token' }}
          IAP_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: ${{ inputs.smoke_only && 'yarn e2e-smoke' || 'yarn e2e' }}
      - name: Check Allure results
        if: ${{ !cancelled() }}
        id: check-results
        env:
          GC_SA_EMAIL: ${{ secrets.GC_SA_EMAIL }}
          GC_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GC_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "No allure results found, skipping report steps."
          fi
          if [ -n "$GC_SA_EMAIL" ] && [ -n "$GC_WORKLOAD_IDENTITY_PROVIDER" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "GCS publishing credentials not provided; the report will not be published to GCS."
          fi
      - name: Authenticate to Google Cloud for GCS
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' && steps.check-results.outputs.publish == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          service_account: ${{ secrets.GC_SA_EMAIL }}
          workload_identity_provider: ${{ secrets.GC_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Set up Cloud SDK
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' && steps.check-results.outputs.publish == 'true' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Load dashboard index and Allure history from GCS
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' && steps.check-results.outputs.publish == 'true' }}
        run: |
          if gsutil cp "gs://$BUCKET/index.json" /tmp/index.json 2>/tmp/gsutil_index_err.log; then
            echo "Downloaded existing index.json from GCS."
          else
            if grep -qiE "No URLs matched|Matched no objects|404" /tmp/gsutil_index_err.log; then
              echo "No existing index.json found in bucket, starting with empty index."
              echo '[]' > /tmp/index.json
            else
              echo "Failed to download index.json from GCS. Error output:"
              cat /tmp/gsutil_index_err.log
              rm -f /tmp/gsutil_index_err.log
              exit 1
            fi
          fi
          rm -f /tmp/gsutil_index_err.log || true

          if gsutil cp "gs://$BUCKET/history.jsonl" ./history.jsonl 2>/tmp/gsutil_history_err.log; then
            echo "Restored Allure history from GCS ($(wc -l < ./history.jsonl) entries)."
          elif grep -qiE "No URLs matched|Matched no objects|404" /tmp/gsutil_history_err.log; then
            echo "No existing history.jsonl in bucket; starting fresh."
          else
            echo "Failed to download history.jsonl from GCS. Error output:" >&2
            cat /tmp/gsutil_history_err.log >&2
            rm -f /tmp/gsutil_history_err.log
            exit 1
          fi
          rm -f /tmp/gsutil_history_err.log || true
      - name: Generate Allure report
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' }}
        run: rm -rf allure-report; yarn allure:generate
      - name: Determine run ID
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' && steps.check-results.outputs.publish == 'true' }}
        id: run-id
        env:
          BRANCH_INPUT: ${{ inputs.branch || github.ref_name }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          SHORT_SHA=$(echo "$COMMIT" | cut -c1-7)
          BRANCH="$BRANCH_INPUT"
          SCOPE="${{ inputs.smoke_only && 'smoke' || 'full' }}"
          RUN_ID="run-${SHORT_SHA}-${{ github.run_number }}-${{ github.run_attempt }}"
          LABEL="$BRANCH #${{ github.run_number }} ($SCOPE)"
          if [ "${{ github.run_attempt }}" != "1" ]; then
            LABEL="$LABEL (attempt ${{ github.run_attempt }})"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
      - name: Upload Allure report to GCS
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' && steps.check-results.outputs.publish == 'true' }}
        env:
          RUN_ID: ${{ steps.run-id.outputs.run_id }}
        run: |
          gsutil -m rsync -r -d ./allure-report "gs://$BUCKET/runs/$RUN_ID/"
          if [ -f "./allure-report/summary.json" ]; then
            gsutil cp ./allure-report/summary.json "gs://$BUCKET/runs/$RUN_ID/summary.json"
          fi
      - name: Persist Allure history to GCS
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' && steps.check-results.outputs.publish == 'true' }}
        run: |
          if [ -f ./history.jsonl ]; then
            gsutil -h "Cache-Control:no-cache" cp ./history.jsonl "gs://$BUCKET/history.jsonl"
            echo "Persisted Allure history to GCS ($(wc -l < ./history.jsonl) entries)."
          else
            echo "No history.jsonl produced; skipping history upload."
          fi
      - name: Point bucket root at latest report
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' && steps.check-results.outputs.publish == 'true' }}
        env:
          RUN_ID: ${{ steps.run-id.outputs.run_id }}
        run: |
          if ! gsutil -q stat "gs://$BUCKET/runs/${RUN_ID}/index.html"; then
            echo "Report not found in GCS, keeping existing root index.html"
            exit 0
          fi
          cat > /tmp/root-index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=runs/${RUN_ID}/index.html">
          <title>Re:Earth CMS E2E</title>
          <a href="runs/${RUN_ID}/index.html">Latest report</a>
          EOF
          gsutil -h "Content-Type:text/html" -h "Cache-Control:no-cache" \
            cp /tmp/root-index.html "gs://$BUCKET/index.html"
      - name: Update dashboard index.json
        if: ${{ !cancelled() && steps.check-results.outputs.has_results == 'true' && steps.check-results.outputs.publish == 'true' }}
        env:
          RUN_ID: ${{ steps.run-id.outputs.run_id }}
          BRANCH: ${{ steps.run-id.outputs.branch }}
          COMMIT: ${{ steps.run-id.outputs.commit }}
          LABEL: ${{ steps.run-id.outputs.label }}
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timezone

          with open('/tmp/index.json') as f:
              runs = json.load(f)

          run_id = os.environ['RUN_ID']
          label = os.environ['LABEL']
          branch = os.environ['BRANCH']
          commit = os.environ['COMMIT']

          runs = [r for r in runs if r.get('id') != run_id]

          new_entry = {
              'id': run_id,
              'label': label,
              'branch': branch,
              'commit': commit,
              'createdAt': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'path': f'runs/{run_id}/index.html'
          }

          runs.insert(0, new_entry)
          evicted = runs[50:]
          runs = runs[:50]

          with open('/tmp/index.json', 'w') as f:
              json.dump(runs, f, indent=2)

          with open('/tmp/evicted_runs.txt', 'w') as f:
              for r in evicted:
                  rid = r.get('id', '')
                  if rid.startswith('run-') and '/' not in rid and '..' not in rid:
                      f.write(rid + '\n')
          "

          OBJECT="gs://$BUCKET/index.json"
          if STAT_OUT=$(gsutil stat "$OBJECT" 2>/tmp/gsutil_stat_err.log); then
            GEN=$(echo "$STAT_OUT" | awk '/Generation:/ {print $2}')
          elif grep -qiE "No URLs matched|Matched no objects|404" /tmp/gsutil_stat_err.log; then
            echo "No existing index.json in bucket; creating it."
            GEN=0
          else
            echo "gsutil stat failed unexpectedly:" >&2
            cat /tmp/gsutil_stat_err.log >&2
            exit 1
          fi
          rm -f /tmp/gsutil_stat_err.log

          gsutil -h "Content-Type:application/json" -h "Cache-Control:no-cache" \
            -h "x-goog-if-generation-match:${GEN}" \
            cp /tmp/index.json "$OBJECT"

          if [ -s /tmp/evicted_runs.txt ]; then
            while IFS= read -r EVICTED_ID; do
              echo "Deleting evicted report runs/$EVICTED_ID from GCS."
              gsutil -m rm -r "gs://$BUCKET/runs/$EVICTED_ID" \
                || echo "Failed to delete runs/$EVICTED_ID; it may already be gone."
            done < /tmp/evicted_runs.txt
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: web/allure-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: test-results
          path: web/test-results/
          retention-days: 7
