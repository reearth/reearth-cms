name: Release
# Step 2 of a release, run from the release branch after Stage and the
# acceptance test. Takes the candidate commit that Stage built and that was
# tested, checks that the release branch and the candidate images match it,
# cuts vX.Y.Z (CHANGELOG commit + tag), promotes the candidate images
# (:stage-<sha>) to :X.Y.Z (+ :latest for stable versions) and publishes a
# GitHub Release.
on:
  workflow_dispatch:
    inputs:
      candidate:
        required: true
        description: 'Candidate commit SHA from the Stage run that was tested (shown in its summary)'
        type: string
      version:
        required: false
        description: 'Next version (run from the "release" branch). Use "custom" for a specific version.'
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        required: false
        description: 'Custom version without "v" (e.g. 0.2.0 or 0.2.0-beta.1) - only used when version is "custom"'
        type: string

concurrency:
  group: release-flow
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every image Stage builds; all of them must exist for the candidate.
  IMAGES: reearth/reearth-cms reearth/reearth-cms-web reearth/reearth-cms-worker reearth/reearth-cms-decompressor reearth/reearth-cms-copier
  # Docker tags cannot contain "+", so build metadata is not allowed.
  VERSION_PATTERN: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.sha.outputs.sha }}
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Validate inputs
        env:
          VERSION_INPUT: ${{ inputs.version }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if ! [[ "$CANDIDATE" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::candidate must be a commit SHA (7-40 lowercase hex characters)"
            exit 1
          fi
          if [ "$VERSION_INPUT" = "custom" ] && ! [[ "$CUSTOM_VERSION" =~ $VERSION_PATTERN ]]; then
            echo "::error::custom_version must look like 1.2.3 or 1.2.3-beta.1 (no leading v, no +metadata)"
            exit 1
          fi
      # The default GITHUB_TOKEN cannot push to release/main, so push with the GitHub App token as stage.yml does.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The branch tip, not the dispatch commit: a re-run after the cut
          # then sees the version commit and resumes it instead of cutting again.
          ref: refs/heads/release
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up git config
        run: |
          git config --global user.name ${{ vars.GH_APP_USER }}
          git config --global user.email ${{ vars.GH_APP_ID }}+${{ vars.GH_APP_USER }}[bot]@users.noreply.github.com
          git config --global pull.rebase false
      - name: Resolve candidate
        id: candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          git fetch --force origin main
          sha=$(git rev-parse --verify --quiet "${CANDIDATE}^{commit}") || {
            echo "::error::Candidate $CANDIDATE is not a known commit"; exit 1; }
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Candidate $sha is not on main"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Release images are built by Stage from the candidate commit, never from
      # the release branch. If release differs from the candidate (another Stage
      # ran after the acceptance test, or a commit was pushed straight to
      # release), the candidate images do not match it.
      - name: Check that release matches the candidate
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          if ! git diff --quiet "$SHA" HEAD -- . ':(exclude)CHANGELOG.md'; then
            echo "::error::release differs from candidate $SHA. Use the candidate of the latest Stage run, or run Stage again and repeat the acceptance test."
            git diff --stat "$SHA" HEAD -- . ':(exclude)CHANGELOG.md'
            exit 1
          fi
      # Check every image before writing anything, so a failed Stage build can
      # never lead to a partial release.
      - name: Check that all candidate images exist
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          missing=0
          for image in $IMAGES; do
            if digest=$(docker buildx imagetools inspect "$image:stage-$SHA" --format '{{json .Manifest.Digest}}' 2>/dev/null); then
              echo "$image:stage-$SHA $digest"
            else
              echo "::error::Missing $image:stage-$SHA. Did every build job of the Stage run succeed?"
              missing=1
            fi
          done
          exit $missing
      - name: Check whether this release was already cut
        id: gate
        # The tag is the checkpoint for the whole release. If release HEAD is
        # already tagged vX.Y.Z (an earlier run pushed it and a later step
        # failed), skip the cut and finish the remaining steps for that tag
        # instead of cutting another version.
        run: |
          git fetch --tags --force origin
          existing=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -n "$existing" ]; then
            echo "cut=true" >> "$GITHUB_OUTPUT"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "::notice::release HEAD is already $existing; skipping the cut and finishing that release"
          else
            echo "cut=false" >> "$GITHUB_OUTPUT"
          fi
      - id: changelog
        name: Generate CHANGELOG
        if: steps.gate.outputs.cut != 'true'
        uses: reearth/changelog-action@cd9d00f467a683c3c9996c1574cfa42d60968dc5 # main
        with:
          version: ${{ inputs.version == 'custom' && inputs.custom_version || inputs.version }}
          repo: ${{ github.repository }}
          latest: CHANGELOG_latest.md
      - id: version
        name: Determine version
        env:
          RAW_VERSION: ${{ steps.gate.outputs.tag || (inputs.version == 'custom' && inputs.custom_version) || steps.changelog.outputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          if ! [[ "$version" =~ $VERSION_PATTERN ]]; then
            echo "::error::Invalid version '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit & tag release
        if: steps.gate.outputs.cut != 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          rm CHANGELOG_latest.md
          git add CHANGELOG.md
          git commit -m "$TAG"
          git tag "$TAG"
          # Atomic: branch and tag land together or not at all.
          git push --atomic origin release "$TAG"
      - id: sha
        name: Resolve release commit
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: echo "sha=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Copy the release CHANGELOG entry to main
        # Cherry-picks the version commit (CHANGELOG.md only) so entries that
        # main already has are kept. A no-op when main already has this version.
        env:
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --force origin main
          git switch -C main origin/main
          if grep -q "^## $VERSION " CHANGELOG.md; then
            echo "main already has the $TAG CHANGELOG entry"
            exit 0
          fi
          if ! git cherry-pick "$TAG"; then
            echo "::error::Could not apply the $TAG CHANGELOG entry to main. Resolve it by hand and push to main."
            git cherry-pick --abort
            exit 1
          fi
          git push origin main

  promote-to-version:
    needs: release
    uses: ./.github/workflows/promote_images.yml
    with:
      from_tag: stage-${{ needs.release.outputs.candidate }}
      # Prereleases (X.Y.Z-suffix) never move :latest.
      to_tags: ${{ needs.release.outputs.prerelease == 'true' && needs.release.outputs.version || format('{0} latest', needs.release.outputs.version) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-release:
    needs: [release, promote-to-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.release.outputs.version }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      # Read the notes from CHANGELOG.md at the tag, so a re-run or a later
      # dispatch can publish the release without the original run's files.
      - name: Extract release notes
        run: |
          awk -v h="## $VERSION " 'index($0, h) == 1 {p = 1; next} p && /^## / {exit} p' CHANGELOG.md > CHANGELOG_latest.md
          if [ ! -s CHANGELOG_latest.md ]; then
            echo "::error::No section for $VERSION in CHANGELOG.md"
            exit 1
          fi
      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          commit: ${{ needs.release.outputs.sha }}
          name: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          bodyFile: CHANGELOG_latest.md
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
      - name: Summary
        run: |
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Images: \`reearth/reearth-cms*:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
