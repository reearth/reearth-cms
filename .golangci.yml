version: "2"
linters:
  default: standard
  enable:
    - exhaustive
  settings:
    exhaustive:
      # Only check switches marked with //exhaustive:enforce, such as the
      # copier's switch over the change types in shared/task.
      explicit-exhaustive: true
run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true
  concurrency: 4
