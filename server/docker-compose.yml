name: reearth-cms
services:
  reearth-cms-server:
    build:
      context: .
    environment:
      REEARTH_DB: mongodb://reearth-cms-mongo
      REEARTH_CMS_OTEL_ENDPOINT: http://reearth-cms-jaeger:4318
    ports:
      - '8080:8080'
    # env_file:
    #   - ./.env
    links:
      - reearth-cms-mongo
      - reearth-cms-jaeger
    depends_on:
      - reearth-cms-mongo
      - reearth-cms-jaeger
    volumes:
      - ./data:/reearth/data
  reearth-cms-mongo:
    image: mongo:6-focal
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
  reearth-cms-jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - '4318:4318'   # OTLP HTTP (ingest from app)
      - '16686:16686' # Jaeger UI

volumes:
  mongo-data:
