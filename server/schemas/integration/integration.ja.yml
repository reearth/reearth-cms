openapi: 3.0.3
info:
  title: ReEarth-CMS インテグレーションAPI
  description: ReEarth-CMS インテグレーションAPI
  version: 1.0.0
paths:
  ###   PROJECTS   ###
  '/{workspaceIdOrAlias}/projects':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/sortDirParam'
      - $ref: '#/components/parameters/keywordParam'
    get:
      operationId: ProjectFilter
      security:
        - bearerAuth: [ ]
      summary: プロジェクトの一覧を返します。
      tags:
        - Projects
      description: プロジェクトの一覧を返します
      responses:
        '200':
          description: プロジェクトのJSON配列
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/project'
                  totalCount:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  perPage:
                    type: integer
                    minimum: 1
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: 内部サーバーエラー
    post:
      operationId: ProjectCreate
      summary: プロジェクトを作成
      tags:
        - Projects
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                license:
                  type: string
                readme:
                  type: string
                alias:
                  type: string
                requestRoles:
                  type: array
                  items:
                    $ref: '#/components/schemas/projectRequestRole'
      responses:
        '201':
          description: 作成されたプロジェクトのJSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
    get:
      operationId: ProjectGet
      security:
        - bearerAuth: [ ]
      summary: プロジェクトを返します。
      tags:
        - Projects
      description: プロジェクトを返します。
      responses:
        '200':
          description: プロジェクトのJSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー
    patch:
      operationId: ProjectUpdate
      security:
        - bearerAuth: [ ]
      summary: プロジェクトを更新します。
      tags:
        - Projects
      description: プロジェクトを更新します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                license:
                  type: string
                readme:
                  type: string
                alias:
                  type: string
                accessibility:
                  $ref: '#/components/schemas/accessibility'
                requestRoles:
                  type: array
                  items:
                    $ref: '#/components/schemas/projectRequestRole'
      responses:
        '200':
          description: 更新されたプロジェクトのJSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: プロジェクトが見つかりません
        '500':
          description: 内部サーバーエラー
    delete:
      operationId: ProjectDelete
      summary: プロジェクトを削除
      tags:
        - Projects
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: プロジェクトが正常に削除されました
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    x-go-type: id.ProjectID
                    type: string
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー

  ###   Models   ###
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/models':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/sortDirParam'
      - $ref: '#/components/parameters/keywordParam'
    get:
      operationId: ModelFilter
      security:
        - bearerAuth: [ ]
      summary: モデルの一覧を返します。
      tags:
        - Models
      description: モデルの一覧を返します。
      responses:
        '200':
          description: ユーザー名のJSON配列
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/model'
                  totalCount:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  perPage:
                    type: integer
                    minimum: 1
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー
    post:
      operationId: ModelCreate
      summary: モデルを作成
      tags:
        - Models
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                key:
                  type: string
      responses:
        '200':
          description: モデルのJSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/models/{modelIdOrKey}':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/modelIdOrKeyParam'
    get:
      operationId: ModelGet
      security:
        - bearerAuth: [ ]
      summary: モデルを返します。
      tags:
        - Models
      description: モデルを返します。
      responses:
        '200':
          description: ユーザー名のJSON配列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー
    patch:
      operationId: ModelUpdate
      security:
        - bearerAuth: [ ]
      summary: モデルを更新します。
      tags:
        - Models
      description: モデルを更新します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                key:
                  type: string
      responses:
        '200':
          description: モデルのJSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー
    delete:
      operationId: ModelDelete
      security:
        - bearerAuth: [ ]
      summary: モデルを削除します。
      tags:
        - Models
      description: モデルを削除します。
      responses:
        '200':
          description: モデルID
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    x-go-type: id.ModelID
                    type: string
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/models/{modelIdOrKey}/schema.json':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/modelIdOrKeyParam'
    get:
      operationId: SchemaByModelAsJSON
      security:
        - bearerAuth: [ ]
      summary: プロジェクトIDとモデルIDでスキーマをJSONとして返します
      tags:
        - Schema
        - JSON
      description: プロジェクトIDとモデルIDでスキーマをJSONとして返します
      responses:
        '200':
          description: JSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONSchema'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/models/{modelIdOrKey}/metadata_schema.json':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/modelIdOrKeyParam'
    get:
      operationId: MetadataSchemaByModelAsJSON
      security:
        - bearerAuth: [ ]
      summary: プロジェクトIDとモデルIDでメタデータスキーマをJSONとして返します
      tags:
        - MetadataSchema
        - JSON
      description: プロジェクトIDとモデルIDでメタデータスキーマをJSONとして返します
      responses:
        '200':
          description: JSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONSchema'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
        '500':
          description: 内部サーバーエラー
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/models/{modelIdOrKey}/import':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/modelIdOrKeyParam'
    put:
      operationId: ModelImport
      summary: 選択したモデルにデータをインポートします
      tags:
        - Models
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId:
                  x-go-type: id.AssetID
                  type: string
                format:
                  type: string
                  enum:
                    - geoJson
                    - json
                strategy:
                  type: string
                  enum:
                    - insert
                    - update
                    - upsert
                mutateSchema:
                  type: boolean
                geometryFieldKey:
                  type: string
                asBackground:
                  type: boolean
              required:
                - assetId
                - format
                - strategy
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                format:
                  type: string
                  enum:
                    - geoJson
                    - json
                strategy:
                  type: string
                  enum:
                    - insert
                    - update
                    - upsert
                mutateSchema:
                  type: boolean
                geometryFieldKey:
                  type: string
              required:
                - assetId
                - format
                - strategy
      responses:
        '200':
          description: インポート状況のJSONオブジェクト
          content:
            application/json:
              schema:
                type: object
                properties:
                  modelId:
                    x-go-type: id.ModelID
                    type: string
                  itemsCount:
                    type: integer
                  insertedCount:
                    type: integer
                  updatedCount:
                    type: integer
                  ignoredCount:
                    type: integer
                  newFields:
                    type: array
                    items:
                      $ref: '#/components/schemas/schemaField'
        '400':
          description: リクエストパラメータの値が無効です
        '404':
          description: 見つかりません
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: 内部サーバーエラー
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/models/{modelIdOrKey}/copy':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/modelIdOrKeyParam'
    post:
      operationId: ModelCopy
      summary: 選択したモデルのスキーマとアイテムをコピーします
      tags:
        - Models
      security:
        - bearerAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                key:
                  type: string
      responses:
        '200':
          description: フィールドのJSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: 内部サーバーエラー

  ###   GROUPS   ###
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/groups':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/sortDirParam'
    get:
      operationId: GroupFilter
      security:
        - bearerAuth: [ ]
      summary: プロジェクト内のグループの一覧を返します。
      tags:
        - Groups
      description: 指定されたプロジェクトに属するグループの一覧を返します。
      responses:
        '200':
          description: プロジェクト内のグループの一覧。
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/group'
                  totalCount:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  perPage:
                    type: integer
                    minimum: 1
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: プロジェクトが見つかりません
        '500':
          description: 内部サーバーエラー
    post:
      operationId: GroupCreate
      summary: プロジェクト内に新しいグループを作成します。
      tags:
        - Groups
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - key
              properties:
                name:
                  type: string
                key:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: 作成されたグループ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: 内部サーバーエラー
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/groups/{groupIdOrKey}':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/groupIdOrKeyParam'
    get:
      operationId: GroupGet
      security:
        - bearerAuth: [ ]
      summary: プロジェクト内のグループを取得します。
      tags:
        - Groups
      description: 指定されたプロジェクト内の特定グループの詳細を返します。
      responses:
        '200':
          description: グループの詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: グループが見つかりません
        '500':
          description: 内部サーバーエラー
    patch:
      operationId: GroupUpdate
      security:
        - bearerAuth: [ ]
      summary: プロジェクト内のグループの詳細を更新します。
      tags:
        - Groups
      description: 特定プロジェクト内のグループの名前、キー、または説明を更新します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                key:
                  type: string
      responses:
        '200':
          description: 更新されたグループ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: グループが見つかりません
        '500':
          description: 内部サーバーエラー
    delete:
      operationId: GroupDelete
      security:
        - bearerAuth: [ ]
      summary: プロジェクト内のグループを削除します。
      tags:
        - Groups
      description: 指定されたプロジェクト内のグループを削除します。
      responses:
        '200':
          description: グループが正常に削除されました。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    x-go-type: id.GroupID
                    type: string
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: グループが見つかりません
        '500':
          description: 内部サーバーエラー

  ###   SCHEMATA   ###
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/schemata/{schemaId}/fields':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/schemaIdParam'
    post:
      operationId: FieldCreate
      summary: フィールドを作成
      tags:
        - Fields
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/valueType'
                key:
                  type: string
                required:
                  type: boolean
                multiple:
                  type: boolean
      responses:
        '200':
          description: フィールドのJSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemaField'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/schemata/{schemaId}/fields/{fieldIdOrKey}':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/schemaIdParam'
      - $ref: '#/components/parameters/fieldIdOrKeyParam'
    patch:
      operationId: FieldUpdate
      summary: フィールドを更新
      tags:
        - Fields
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/valueType'
                key:
                  type: string
                required:
                  type: boolean
                multiple:
                  type: boolean
      responses:
        '200':
          description: フィールドのJSONオブジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemaField'
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません
    delete:
      operationId: FieldDelete
      summary: フィールドを削除
      tags:
        - Fields
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: フィールドのJSONオブジェクト
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    x-go-type: id.FieldID
                    type: string
        '400':
          description: リクエストパラメータの値が無効です
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 見つかりません

  ###   ITEMS   ###
  '/{workspaceIdOrAlias}/projects/{projectIdOrAlias}/models/{modelIdOrKey}/items':
    parameters:
      - $ref: '#/components/parameters/workspaceIdOrAliasParam'
      - $ref: '#/components/parameters/projectIdOrAliasParam'
      - $ref: '#/components/parameters/modelIdOrKeyParam'
    get:
      operationId: ItemFilter
      security:
        - bearerAuth: [ ]
      summary: アイテムの一覧を返します。
      tags:
        - Items
      description: フィルタリングと並び替えを適用したアイテムの一覧を返します。
      parameters:
        - $ref: '#/components/parameters/sortParam'
        - $ref: '#/components/parameters/sortDirParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - $ref: '#/components/parameters/refParam'
        - $ref: '#/components/parameters/assetParam'
        - $ref: '#/components/parameters/keywordParam'
      responses:
        '200':
          description: ユーザー名のJSON配列
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/versionedItem'
                  totalCount:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
