components:
  parameters:
    workspaceIdOrAliasParam:
      name: workspaceIdOrAlias
      in: path
      description: ワークスペースのIDまたはエイリアス
      required: true
      schema:
        type: string
        x-go-type: accountdomain.WorkspaceIDOrAlias
    projectIdOrAliasParam:
      name: projectIdOrAlias
      in: path
      description: プロジェクトのIDまたはエイリアス
      required: true
      schema:
        type: string
        x-go-type: project.IDOrAlias
    schemaIdParam:
      name: schemaId
      in: path
      description: モデル内のスキーマのID
      required: true
      schema:
        type: string
        x-go-type: id.SchemaID
    modelIdOrKeyParam:
      name: modelIdOrKey
      in: path
      description: プロジェクト内のモデルのIDまたはキー
      required: true
      schema:
        type: string
        x-go-type: model.IDOrKey
    groupIdOrKeyParam:
      name: groupIdOrKey
      in: path
      description: プロジェクト内のグループのIDまたはキー
      required: true
      schema:
        type: string
        x-go-type: group.IDOrKey
    fieldIdOrKeyParam:
      name: fieldIdOrKey
      in: path
      description: モデルのスキーマ内のフィールドのIDまたはキー
      required: true
      schema:
        type: string
        x-go-type: schema.FieldIDOrKey
    itemIdParam:
      name: itemId
      in: path
      description: 選択されたアイテムのID
      required: true
      schema:
        type: string
        x-go-type: id.ItemID
    assetIdParam:
      name: assetId
      in: path
      description: 選択されたアセットのID
      required: true
      schema:
        type: string
        x-go-type: id.AssetID
    commentIdParam:
      name: commentId
      in: path
      description: 選択されたコメントのID
      required: true
      schema:
        x-go-type: id.CommentID
        type: string
    sortParam:
      name: sort
      in: query
      description: レスポンス一覧の並び順を指定するために使用します
      required: false
      schema:
        type: string
        default: createdAt
        enum:
          - createdAt
          - updatedAt
    sortDirParam:
      name: dir
      in: query
      description: 'レスポンス一覧の並び替え方向を指定するために使用します。並び順が指定されていない場合は無視されます'
      required: false
      schema:
        type: string
        default: desc
        enum:
          - asc
          - desc
    pageParam:
      name: page
      in: query
      description: ページを選択するために使用します
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    perPageParam:
      name: perPage
      in: query
      description: ページを選択するために使用します
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    refParam:
      name: ref
      in: query
      description: refまたはverを選択するために使用します
      required: false
      schema:
        type: string
        default: latest
        enum:
          - latest
          - public
    assetParam:
      name: asset
      in: query
      description: 結果にアセットデータを埋め込むかどうかを指定します
      schema:
        $ref: '#/components/schemas/assetEmbedding'
    keywordParam:
      name: keyword
      in: query
      description: キーワード文字列
      required: false
      schema:
        type: string
  schemas:
    project:
      type: object
      required:
        - id
        - name
        - description
        - license
        - readme
        - workspaceId
        - alias
        - accessibility
        - createdAt
        - updatedAt
      properties:
        id:
          x-go-type: id.ProjectID
          type: string
        workspaceId:
          x-go-type: accountdomain.WorkspaceID
          type: string
        name:
          type: string
        description:
          type: string
        license:
          type: string
        readme:
          type: string
        alias:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        accessibility:
          $ref: '#/components/schemas/accessibility'
        requestRoles:
          type: array
          items:
            $ref: '#/components/schemas/projectRequestRole'
    publicationSettings:
      type: object
      properties:
        publicModels:
          type: array
          items:
            type: string
            x-go-type: id.ModelID
        publicAssets:
          type: boolean
      required:
        - publicModels
        - publicAssets
    apiKey:
      type: object
      properties:
        id:
          type: string
          x-go-type: id.APIKeyID
        name:
          type: string
        description:
          type: string
        key:
          type: string
        publication:
          $ref: '#/components/schemas/publicationSettings'
      required:
        - id
        - name
        - key
        - publication
    accessibility:
      type: object
      properties:
        visibility:
          type: string
          enum: [ PUBLIC, PRIVATE ]
        publication:
          $ref: '#/components/schemas/publicationSettings'
        apiKeys:
          type: array
          items:
            $ref: '#/components/schemas/apiKey'
      required:
        - visibility
        - apiKeys
    projectRequestRole:
      type: string
      enum: [ READER, WRITER, MAINTAINER, OWNER ]
    model:
      type: object
      properties:
        id:
          x-go-type: id.ModelID
          type: string
        projectId:
          x-go-type: id.ProjectID
          type: string
        schemaId:
          x-go-type: id.SchemaID
          type: string
        schema:
          $ref: '#/components/schemas/schema'
        metadataSchemaId:
          x-go-type: id.SchemaID
          type: string
        metadataSchema:
          $ref: '#/components/schemas/schema'
        name:
          type: string
        description:
          type: string
        key:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    group:
      type: object
      required:
        - id
        - schemaId
        - projectId
        - name
        - description
        - key
        - schema
        - fields
      properties:
        id:
          x-go-type: id.GroupID
          type: string
        schemaId:
          x-go-type: id.SchemaID
          type: string
        projectId:
          x-go-type: id.ProjectID
          type: string
        name:
          type: string
        description:
          type: string
        key:
          type: string
        schema:
          $ref: '#/components/schemas/schema'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/schemaField'
    schema:
      type: object
      properties:
        id:
          x-go-type: id.SchemaID
          type: string
        projectId:
          x-go-type: id.ProjectID
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/schemaField'
        titleField:
          x-go-type: id.FieldID
          type: string
        createdAt:
          type: string
          format: date-time
    JSONSchema:
      type: object
      x-go-type: types.JSONSchema
    valueType:
      type: string
      enum:
        - text
        - textArea
        - richText
        - markdown
        - checkbox
        - asset
        - date
        - bool
        - select
        - integer
        - number
        - reference
        - url
        - group
        - tag
        - geometryObject
        - geometryEditor
    tagResponse:
      type: object
      properties:
        id:
          x-go-type: id.TagID
          type: string
        name:
          type: string
        color:
          type: string
    schemaField:
      type: object
      properties:
        id:
          x-go-type: id.FieldID
          type: string
        type:
          $ref: '#/components/schemas/valueType'
        key:
          type: string
        required:
          type: boolean
        multiple:
          type: boolean
        name:
          type: string
      required:
        - id
        - type
        - key
        - required
        - multiple
        - name
    version:
      type: object
      properties:
        version:
          type: string
          format: uuid
        parents:
          type: array
          items:
            type: string
            format: uuid
        refs:
          type: array
          items:
            type: string
    item:
      type: object
      properties:
        id:
          x-go-type: id.ItemID
          type: string
        metadataItemId:
          x-go-type: id.ItemID
          type: string
        originalItemId:
          x-go-type: id.ItemID
          type: string
        modelId:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/field'
        metadataFields:
          type: array
          items:
            $ref: '#/components/schemas/field'
        referencedItems:
          type: array
          items:
            $ref: '#/components/schemas/item'
        createdAt:
          type: string
          format: date-time
        isMetadata:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    GeoJSON:
      type: object
      x-go-type: types.GeoJSON
    versionedItem:
      allOf:
        - $ref: '#/components/schemas/item'
        - $ref: '#/components/schemas/version'
        - type: object
          properties:
            referencedItems:
              type: array
              items:
                $ref: '#/components/schemas/versionedItem'
    field:
      type: object
      properties:
        id:
          x-go-type: id.FieldID
          type: string
        type:
          $ref: '#/components/schemas/valueType'
        value: { }
        key:
          type: string
        group:
          x-go-type: id.ItemGroupID
          type: string
    refOrVersion:
      type: object
      properties:
        ref:
          type: string
          enum:
            - latest
            - public
        version:
          type: string
          format: uuid
    assetEmbedding:
      type: string
      enum:
        - all
        - "true"
        - "false"
    asset:
      type: object
      required:
        - id
        - projectId
        - url
        - createdAt
        - updatedAt
        - public
      properties:
        id:
          x-go-type: id.AssetID
          type: string
        projectId:
          x-go-type: id.ProjectID
          type: string
        name:
          type: string
        url:
          type: string
        contentType:
          type: string
        previewType:
          type: string
          enum:
            - image
            - image_svg
            - geo
            - geo_3d_Tiles
            - geo_mvt
            - model_3d
            - csv
            - unknown
        totalSize:
          type: number
        archiveExtractionStatus:
          type: string
          enum:
            - pending
            - in_progress
            - done
            - failed
        file:
          $ref: '#/components/schemas/file'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        public:
          type: boolean
    comment:
      type: object
      properties:
        id:
          x-go-type: id.CommentID
          type: string
        authorId:
          type: string
          x-go-type: any
        authorType:
          type: string
          enum:
            - user
            - integrtaion
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    file:
      type: object
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string
        path:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/file'
    fieldSelector:
      type: object
      properties:
        fieldId:
          x-go-type: id.FieldID
          type: string
        type:
          type: string
          enum:
            - id
            - creationDate
            - creationUser
            - modificationDate
            - modificationUser
            - status
            - field
            - metaField
    condition:
      type: object
      properties:
        and:
          type: array
          items:
            $ref: '#/components/schemas/condition'
        or:
          type: array
          items:
            $ref: '#/components/schemas/condition'
        basic:
          type: object
          properties:
            fieldId:
              $ref: '#/components/schemas/fieldSelector'
            operator:
              type: string
              enum:
                - equals
                - notEquals
            value: { }
        nullable:
          type: object
          properties:
            fieldId:
              $ref: '#/components/schemas/fieldSelector'
            operator:
              type: string
              enum:
                - empty
                - notEmpty
        multiple:
          type: object
          properties:
            fieldId:
              $ref: '#/components/schemas/fieldSelector'
            operator:
              type: string
              enum:
                - includesAny
                - notIncludesAny
                - includesAll
                - notIncludesAll
            value:
              type: array
              items: { }
          required:
            - fieldId
            - operator
            - value
        bool:
          type: object
          properties:
            fieldId:
              $ref: '#/components/schemas/fieldSelector'
            operator:
              type: string
              enum:
                - equals
                - notEquals
            value:
              type: boolean
          required:
            - fieldId
            - operator
            - value
        string:
          type: object
          properties:
            fieldId:
              $ref: '#/components/schemas/fieldSelector'
            operator:
              type: string
              enum:
                - contains
                - notContains
                - startsWith
                - endsWith
                - notStartsWith
                - notEndsWith
            value:
              type: string
          required:
            - fieldId
            - operator
            - value
        number:
          type: object
          properties:
            fieldId:
              $ref: '#/components/schemas/fieldSelector'
            operator:
              type: string
              enum:
                - greaterThan
                - lessThan
                - greaterThanOrEqualTo
                - lessThanOrEqualTo
            value:
              type: number
          required:
            - fieldId
            - operator
            - value
        time:
          type: object
          properties:
            fieldId:
              $ref: '#/components/schemas/fieldSelector'
            operator:
              type: string
              enum:
                - before
                - after
                - beforeOrOn
                - afterOrOn
                - ofThisWeek
                - ofThisMonth
                - ofThisYear
            value:
              type: string
              format: date-time
          required:
            - fieldId
            - operator
            - value
  responses:
    UnauthorizedError:
      description: アクセストークンが存在しないか無効です
    NotFoundError:
      description: 要求されたリソースが見つかりませんでした
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
