openapi: 3.0.3
info:
  title: Re:Earth CMS - Public API
  description: Public API for accessing published data from Re:Earth CMS projects.
  version: "1.0.0"

servers:
  - url: /api/p/{workspace}/{project}
    description: Public API endpoint
    variables:
      workspace:
        default: "{workspace}"
        description: Workspace ID or alias
      project:
        default: "{project}"
        description: Project ID or alias

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        API key authentication. Required only for Private projects.
        Send the API key as a bearer token: `Authorization: Bearer <your_api_key>`.
        An invalid key results in a 401 response.

  parameters:
    modelParam:
      name: model
      in: path
      required: true
      description: Model ID or key
      schema:
        type: string

    itemIdParam:
      name: itemId
      in: path
      required: true
      description: Item ID
      schema:
        type: string

    assetIdParam:
      name: assetId
      in: path
      required: true
      description: Asset ID
      schema:
        type: string

    pageParam:
      name: page
      in: query
      description: |
        Page number for page-based pagination. Values of 0 or less are treated as 1.
        Ignored if `start_cursor` or `offset` is also provided
        (pagination mode precedence: `start_cursor` > `offset` > `page`).
      schema:
        type: integer

    limitParam:
      name: limit
      in: query
      description: |
        Number of items per page. Applies to all pagination modes (page, offset, and cursor).
        Also accepted under the aliases `perPage`, `per_page`, `page_size`, and `pageSize`;
        if several are provided, they are checked in that order of precedence, starting with `limit`.
        Values above 100 are clamped to 100; values of 0 or less fall back to the default of 50.
      schema:
        type: integer
        default: 50
        maximum: 100

    offsetParam:
      name: offset
      in: query
      description: |
        Number of items to skip (offset-based pagination).
        Takes precedence over `page`; ignored if `start_cursor` is also provided.
      schema:
        type: integer

    startCursorParam:
      name: start_cursor
      in: query
      description: |
        Cursor for cursor-based pagination.
        Takes precedence over `offset` and `page` when provided.
      schema:
        type: string

  schemas:
    SuccessResponse:
      type: object
      description: |
        Successful response. The structure varies per project and model.
        Field keys are defined by the model schema in Re:Earth CMS.

    PostItemRequest:
      type: object
      properties:
        fields:
          type: object
          description: |
            Field values keyed by field key. Fields of type Asset, Reference, Tag, Group,
            GeometryEditor, and GeometryObject are not supported for posting and are ignored;
            if such a field is required by the model, posting is rejected entirely.

    PostItemResponse:
      type: object
      required:
        - id
        - $createdAt
        - fields
      properties:
        id:
          type: string
          description: Unique ID of the created item
        $createdAt:
          type: string
          format: date-time
          description: Timestamp when the item was created
        fields:
          type: object
          description: Field values keyed by field key

    Error:
      type: object
      required:
        - error
        - code
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code (mirrors code).
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - invalid_json
            - validation_error
            - posting_disabled
            - model_posting_disabled
            - origin_not_allowed
            - not_found
            - payload_too_large
            - rate_limited
            - access_denied
            - unsupported_field_type
        message:
          type: string
          description: Human-readable description of the error.
        details:
          type: array
          description: Field-level validation errors, present only for validation_error.
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string

  responses:
    UnauthorizedError:
      description: API key is invalid

paths:
  # --- Items ---

  /{model}:
    get:
      summary: Get all items
      description: Returns all published items from the specified model by default, and returns a paginated page response when pagination parameters are provided.
      tags:
        - Items
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/modelParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/startCursorParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Model not found or not public

  /{model}.json:
    get:
      summary: Get all items (JSON)
      description: |
        Returns all published items from the specified model by default,
        and returns a paginated page response when pagination parameters are provided (explicit JSON endpoint).
      tags:
        - Items
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/modelParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/startCursorParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Model not found or not public

  /{model}.csv:
    get:
      summary: Get all items (CSV)
      description: |
        Returns all published items as CSV from the specified model by default,
        and returns a paginated page response as CSV when pagination parameters are provided (CSV endpoint).
      tags:
        - Items
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/modelParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/startCursorParam'
      responses:
        '200':
          description: Successful response
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Model not found or not public

  /{model}.geojson:
    get:
      summary: Get all items (GeoJSON)
      description: |
        Returns all published items from the specified model by default, and returns a paginated page response when pagination parameters are provided (GeoJSON endpoint).
        Requires the model to have a Geometry type field defined.
        Uses the first (based on the order) Geometry type field in the model schema fields.
      tags:
        - Items
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/modelParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/startCursorParam'
      responses:
        '200':
          description: Successful response
          content:
            application/geo+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Model not found or not public

  /{model}/{itemId}:
    get:
      summary: Get an item by ID
      description: Retrieve a single published item from the specified model by its ID.
      tags:
        - Items
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/modelParam'
        - $ref: '#/components/parameters/itemIdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Item not found

  /{model}/items:
    post:
      summary: Create a new item
      description: |
        Submit a new item to the specified model. The created item is unpublished (Draft)
        and will not appear in the public read API until it is published.
        Only available when posting is enabled for both the project and the model.
        Rate-limited per IP; when the limit is exceeded, a `Retry-After` header indicates
        how many seconds to wait before retrying.
      tags:
        - Items
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/modelParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostItemRequest'
      responses:
        '202':
          description: Item accepted and created as unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostItemResponse'
        '400':
          description: Invalid JSON body or field validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Posting disabled for the project/model, or origin not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the allowed size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Model has a required field of an unsupported type for posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests; retry after the period indicated by the `Retry-After` header
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      summary: CORS preflight for item posting
      description: Handles the CORS preflight request for browser-based posting clients.
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/modelParam'
      responses:
        '204':
          description: Preflight response

  # --- Schema ---

  /{model}.schema.json:
    get:
      summary: Get model schema
      description: Retrieve the JSON schema for the specified model.
      tags:
        - Schema
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/modelParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Model not found

  /{model}.metadata_schema.json:
    get:
      summary: Get model metadata schema
      description: Retrieve the metadata JSON schema for the specified model.
      tags:
        - Schema
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/modelParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Model not found

  # --- Assets ---

  /assets:
    get:
      summary: Get all assets
      description: |
        Returns all public assets in the project by default,
        and returns a paginated page response when pagination parameters are provided.
      tags:
        - Assets
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/startCursorParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: No assets found

  /assets.json:
    get:
      summary: Get all assets (JSON)
      description: |
        Returns all public assets in the project by default,
        and returns a paginated page response when pagination parameters are provided (explicit JSON endpoint).
      tags:
        - Assets
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/startCursorParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: No assets found

  /assets/{assetId}:
    get:
      summary: Get an asset by ID
      description: |
        Retrieve a single public asset by its ID.
      tags:
        - Assets
      security:
        - { }
        - apiKey: [ ]
      parameters:
        - $ref: '#/components/parameters/assetIdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Asset not found

  # --- OpenAPI Schema ---

  /:
    get:
      summary: Get OpenAPI schema
      description: |
        Retrieve the OpenAPI schema for this project. Generated dynamically per project.
        Served at the base project URL (`/api/p/{workspace}/{project}`).
      tags:
        - Schema
      responses:
        '200':
          description: OpenAPI schema
          content:
            application/json:
              schema:
                type: object
